<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Certificate verification - Tikariya's School of Music</title>
<style>
body{margin:0;font:16px Georgia,serif;color:#111;background:#fff}
header{background:#3A3283;color:#fff;padding:18px 16px;display:flex;align-items:center;gap:12px}
header img{width:56px;height:56px;border-radius:10px;background:#fff}header h1{font-size:20px;margin:0}header small{font:14px sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
.card{border:2px solid #3A3283;border-radius:14px;padding:16px;background:#F2F0FF}
.ok{background:#00793A;color:#fff;border-radius:12px;padding:12px 14px;font:700 18px sans-serif;margin-bottom:12px}
.bad{background:#D91C26;color:#fff;border-radius:12px;padding:12px 14px;font:700 18px sans-serif;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font:16px sans-serif}td{padding:8px 4px;border-top:1px solid #bbb;vertical-align:top}td:first-child{font-weight:700;width:38%}
.f{font:13px/1.5 sans-serif;margin-top:16px;color:#333}
</style>
</head>
<body>
<header><img src="logo.png" alt="TSM"><div><small>Certificate verification</small><h1>Tikariya&rsquo;s School of Music</h1></div></header>
<main><div id="out" class="card">Checking&hellip;</div>
<div class="f"><b>B. S. Tikariya Cultural Foundation (R)</b><br>CIN: U88900MH2025NPL454435<br>Run in honour of Shree B. S. Tikariya</div></main>
<script>
// Fill in your Firebase project id and web API key (same values as in firebase-config.js)
var CFG = { projectId: "", apiKey: "" };
var out = document.getElementById('out');
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function bad(t){out.innerHTML='<div class="bad">'+t+'</div><p>This certificate could not be verified. Please contact the school.</p>'}
var id = new URLSearchParams(location.search).get('id') || '';
if (!id) { bad('No certificate number'); }
else if (!CFG.projectId) { bad('Page not set up yet'); }
else {
  fetch('https://firestore.googleapis.com/v1/projects/' + CFG.projectId + '/databases/(default)/documents/certs/' + encodeURIComponent(id.replace(/\//g,'-')) + '?key=' + CFG.apiKey)
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(d){
      if (!d || !d.fields) { bad('Certificate not found'); return; }
      var f = d.fields, v = function(k){ return f[k] ? (f[k].stringValue || '') : ''; };
      if (f['void'] && f['void'].booleanValue) { bad('This certificate has been cancelled'); return; }
      var dt = v('date').split('-').reverse().join('/');
      out.innerHTML = '<div class="ok">Verified: this certificate is genuine</div><table>' +
        '<tr><td>Certificate no.</td><td>' + esc(v('cid')) + '</td></tr>' +
        '<tr><td>Awarded to</td><td>' + esc(v('name')) + '</td></tr>' +
        '<tr><td>Instrument</td><td>' + esc(v('course')) + '</td></tr>' +
        '<tr><td>Examination</td><td>' + esc(v('exam')) + '</td></tr>' +
        '<tr><td>Grade</td><td>' + esc(v('grade')) + '</td></tr>' +
        '<tr><td>Date</td><td>' + esc(dt) + '</td></tr></table>';
    })
    .catch(function(){ bad('Could not check right now'); });
}
</script>
</body>
</html>
